services:
  oryn:
    build: .
    image: oryn:local
    container_name: oryn
    restart: unless-stopped
    env_file: .env
    ports:
      # Loopback only: Oryn has no login, so never publish it on 0.0.0.0
      - "127.0.0.1:6796:6796"
    volumes:
      - oryn-data:/app/data

volumes:
  oryn-data:
