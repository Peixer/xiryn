# Allowlist in front of /var/run/docker.sock for the compose stack.
# Only the Docker API calls Xiryn makes are accepted. HAProxy does not read
# request bodies, so POST /containers/create can still ask for a privileged
# container or a host bind mount. See the comment in docker-compose.yml.
#
# Call sites (CLI -> API):
#   lib/docker.ts              docker info                 GET  /info
#   docker CLI (every command) version + ping              GET  /version  GET|HEAD /_ping
#   lib/workstation.ts         inspect, ps, port           GET  /containers/json
#                                                     GET  /containers/<id>/json
#                              create                      POST /containers/create
#                              start, stop                 POST /containers/<id>/start|stop
#                              rm                          DELETE /containers/<id>
#                              exec                        POST /containers/<id>/exec
#                                                          POST /exec/<id>/start
#                                                          GET  /exec/<id>/json
#   lib/workstation.ts         volume create/inspect/ls/rm
#                              POST /volumes/create  GET /volumes  GET|DELETE /volumes/<name>
#   lib/workstation-image.ts   image inspect, images, rmi  GET /images/json
#                                                     GET /images/<name>/json
#                                                     DELETE /images/<name>
#                              build                       POST /build
#   Compose sets DOCKER_BUILDKIT=0. Docker 29's buildx defaults to the
#   docker-container driver, which pulls moby/buildkit (POST /images/create,
#   denied) and would mount the real engine socket. The legacy builder is
#   the path that was run through this proxy.
# Not used, and denied: logs, pull (/images/create), session, grpc, networks,
# events, plugins, swarm, secrets, configs, services, tasks, nodes, system,
# auth, commit, distribution.

global
    log stdout format raw local0 info
    maxconn 256
    # The process is root so it can open the engine socket. Say so, or
    # haproxy 3.4 warns and keeps running as root anyway.
    user root
    group root

defaults
    mode http
    log global
    option httplog
    option dontlognull
    option http-server-close
    timeout http-request 30s
    timeout connect 10s
    timeout client 90m
    timeout server 90m
    timeout tunnel 90m
    timeout http-keep-alive 10s

frontend docker_front
    bind :2375
    http-request deny unless METH_GET || METH_HEAD || METH_POST || METH_DELETE

    http-request allow if METH_GET { path,url_dec -m reg -i ^(/v[0-9.]+)?/info$ }
    http-request allow if METH_GET { path,url_dec -m reg -i ^(/v[0-9.]+)?/version$ }
    http-request allow if METH_GET { path,url_dec -m reg -i ^(/v[0-9.]+)?/_ping$ }
    http-request allow if METH_HEAD { path,url_dec -m reg -i ^(/v[0-9.]+)?/_ping$ }

    http-request allow if METH_GET { path,url_dec -m reg -i ^(/v[0-9.]+)?/containers/json$ }
    http-request allow if METH_GET { path,url_dec -m reg -i ^(/v[0-9.]+)?/containers/[A-Za-z0-9_.-]+/json$ }
    http-request allow if METH_POST { path,url_dec -m reg -i ^(/v[0-9.]+)?/containers/create$ }
    http-request allow if METH_POST { path,url_dec -m reg -i ^(/v[0-9.]+)?/containers/[A-Za-z0-9_.-]+/start$ }
    http-request allow if METH_POST { path,url_dec -m reg -i ^(/v[0-9.]+)?/containers/[A-Za-z0-9_.-]+/stop$ }
    http-request allow if METH_DELETE { path,url_dec -m reg -i ^(/v[0-9.]+)?/containers/[A-Za-z0-9_.-]+$ }
    http-request allow if METH_POST { path,url_dec -m reg -i ^(/v[0-9.]+)?/containers/[A-Za-z0-9_.-]+/exec$ }
    http-request allow if METH_POST { path,url_dec -m reg -i ^(/v[0-9.]+)?/exec/[A-Za-z0-9_.-]+/start$ }
    # The CLI reads the exit code from here after the exec stream closes.
    http-request allow if METH_GET { path,url_dec -m reg -i ^(/v[0-9.]+)?/exec/[A-Za-z0-9_.-]+/json$ }

    http-request allow if METH_GET { path,url_dec -m reg -i ^(/v[0-9.]+)?/volumes$ }
    http-request allow if METH_GET { path,url_dec -m reg -i ^(/v[0-9.]+)?/volumes/[A-Za-z0-9_.-]+$ }
    http-request allow if METH_POST { path,url_dec -m reg -i ^(/v[0-9.]+)?/volumes/create$ }
    http-request allow if METH_DELETE { path,url_dec -m reg -i ^(/v[0-9.]+)?/volumes/[A-Za-z0-9_.-]+$ }

    http-request allow if METH_GET { path,url_dec -m reg -i ^(/v[0-9.]+)?/images/json$ }
    http-request allow if METH_GET { path,url_dec -m reg -i ^(/v[0-9.]+)?/images/.+/json$ }
    http-request allow if METH_DELETE { path,url_dec -m reg -i ^(/v[0-9.]+)?/images/.+ }

    http-request allow if METH_POST { path,url_dec -m reg -i ^(/v[0-9.]+)?/build$ }

    http-request deny
    default_backend docker_engine

backend docker_engine
    server engine unix@/var/run/docker.sock
