name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Typecheck · lint · format · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build

  install:
    name: Install on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Proves the native SQLite binding loads on this platform
      - run: node -e "new (require('better-sqlite3'))(':memory:').prepare('select 1').get()"
      - run: npm run typecheck

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: xiryn:ci

  workstation:
    name: Workstation image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build --tag xiryn-workstation:ci workstation
      # Boots the desktop and proves the tools agents rely on all work
      - name: Smoke test
        run: |
          # Same confinement as a workstation Xiryn creates: no capabilities,
          # no new privileges, a pid limit, and a memory cap (lib/docker.ts).
          docker run -d --name ws \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --pids-limit 512 \
            --memory 4096m \
            --shm-size 1g \
            -e XIRYN_VNC_PASSWORD=ci-check \
            xiryn-workstation:ci
          docker exec ws xiryn-ready
          docker exec ws xiryn-run 30 'node --version && npm --version && python --version && git --version && cloudflared --version'
          docker exec ws xdotool mousemove 10 10 click 1
          docker exec ws xiryn-shot | base64 -d | head -c 3 | od -An -tx1 | grep -q 'ff d8 ff'
          docker exec ws sh -c 'curl -sf -o /dev/null http://localhost:6080/vnc.html'
          # A stopped machine must start again (idle machines stop themselves)
          docker stop --time 5 ws
          docker start ws
          docker exec ws xiryn-ready
          # The page origin comes from xiryn-cdp's socket, which appears only
          # after Chromium answers on the debugging pipe. TCP 9222 stays closed
          # so a shell cannot read a filled password by curling a well-known port.
          docker exec ws sh -c 'for i in $(seq 30); do out=$(xiryn-cdp pages 2>/dev/null) || { sleep 1; continue; }; printf "%s\n" "$out" | grep -q "\"pages\"" && exit 0; sleep 1; done; echo "xiryn-cdp did not answer" >&2; exit 1'
          docker exec ws sh -c '! curl -sf --max-time 2 -o /dev/null http://127.0.0.1:9222/json/version'
